services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: phonehub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phonehub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: phonehub_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_ACCESS_SECRET: docker_dev_access_secret_change_me
      JWT_REFRESH_SECRET: docker_dev_refresh_secret_change_me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      REDIS_URL: redis://redis:6379
      ADMIN_FIRST_NAME: PhoneHub
      ADMIN_LAST_NAME: Admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Password123
    command: sh -c "npm run migrate && npm start"

volumes:
  postgres_data:
